<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EditX · Kriztech | Professional Web Image Editor</title>
    <meta name="description"
        content="Edit, crop, resize, and enhance images instantly with EditX by Kriztech. Free online image editor with AI background removal, filters, and privacy-focused local processing.">
    <meta name="keywords"
        content="image editor, online photo editor, AI background remover, crop image, resize image, photo filters, Kriztech, EditX">
    <meta name="author" content="Kriztech">
    <meta name="theme-color" content="#0b0f1c">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://altkriz.github.io/editx/">
    <meta property="og:title" content="EditX · Kriztech | AI-Powered Image Studio">
    <meta property="og:description"
        content="Professional grade image editing in your browser. No uploads required for basic edits. AI background removal, smart resizing, and premium filters.">
    <meta property="og:image" content="https://altkriz.github.io/editx/editorx_banner.png">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://altkriz.github.io/editx/">
    <meta property="twitter:title" content="EditX · Kriztech | AI-Powered Image Studio">
    <meta property="twitter:description"
        content="Professional grade image editing in your browser. AI background removal, smart resizing, and premium filters.">
    <meta property="twitter:image" content="https://altkriz.github.io/editx/editorx_banner.png">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://altkriz.github.io/editx/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js"></script>
    <!-- Font Awesome 6 (free) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: radial-gradient(circle at 20% 30%, #0b0f1c, #03050b);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        /* glassmorphic card — more compact */
        .editor-card {
            max-width: 1100px;
            /* narrower to reduce canvas footprint */
            width: 100%;
            background: rgba(18, 22, 40, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 2.8rem;
            /* slightly smaller radius */
            padding: 1.8rem 2.2rem;
            box-shadow: 0 30px 60px -10px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.02) inset;
        }

        .kriztech-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            /* reduced spacing */
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 1rem;
        }

        .logo-glow {
            font-size: 2.4rem;
            /* smaller brand */
            font-weight: 700;
            background: linear-gradient(130deg, #ffffff, #c0c9ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 12px #4f6eff55);
        }

        .logo-small {
            font-size: 0.9rem;
            background: rgba(255, 255, 255, 0.25);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            border-left: 2px solid #3e4f8b;
            padding-left: 0.8rem;
            margin-left: 0.6rem;
        }

        .upload-area {
            background: rgba(0, 0, 0, 0.3);
            border: 1.5px dashed rgba(120, 150, 255, 0.5);
            border-radius: 1.8rem;
            transition: 0.2s ease;
            padding: 0.5rem 1rem;
        }

        .file-label {
            cursor: pointer;
            padding: 0.6rem 1.5rem;
            background: linear-gradient(135deg, #1f2747, #131a33);
            border-radius: 3rem;
            color: white;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 1px solid #2f3b68;
            font-size: 0.9rem;
        }

        /* canvas wrapper — reduced padding & fixed max-height */
        .canvas-wrapper {
            background: #0c1020;
            border-radius: 2rem;
            padding: 0.8rem;
            /* leaner */
            box-shadow: inset 0 4px 12px #000000, 0 16px 30px -10px #000000cc;
            border: 1px solid #2a3250;
            max-height: 340px;
            /* constrain canvas area */
            display: flex;
            justify-content: center;
        }

        canvas {
            display: block;
            max-width: 100%;
            max-height: 320px;
            /* actual canvas display size limited */
            width: auto;
            height: auto;
            border-radius: 1.4rem;
            background: repeating-conic-gradient(#20263f 0% 25%, #2b324f 0% 50%) 50% / 30px 30px;
            object-fit: contain;
            /* keep aspect ratio */
        }

        /* control panels more compact */
        .control-panel {
            background: rgba(12, 16, 30, 0.6);
            backdrop-filter: blur(12px);
            border-radius: 1.8rem;
            padding: 1.4rem 1.2rem;
            border: 1px solid #2a3255;
            box-shadow: 0 18px 30px -12px #000000;
        }

        .panel-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1.2rem;
            color: #ccd9ff;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border-bottom: 1px solid #2d365a;
            padding-bottom: 0.6rem;
        }

        .slider-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #9da9d0;
            margin-top: 0.8rem;
            margin-bottom: 0.1rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type=range] {
            width: 100%;
            height: 5px;
            background: #252e4e;
            border-radius: 20px;
            -webkit-appearance: none;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 10px #6d8cff;
            border: 2px solid #b0c2ff;
            cursor: pointer;
        }

        .luxury-btn {
            background: rgba(24, 30, 54, 0.8);
            border: 1px solid #3a4570;
            color: #e0e6ff;
            border-radius: 2.5rem;
            padding: 0.55rem 0.8rem;
            font-weight: 500;
            transition: 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            backdrop-filter: blur(4px);
            width: 100%;
            margin-bottom: 0.6rem;
            font-size: 0.85rem;
        }

        .luxury-btn:hover {
            background: #2e3b68;
            border-color: #6f8aff;
            box-shadow: 0 0 15px #3d5afe60;
        }

        .bg-radio-group {
            background: #0f1429;
            padding: 0.8rem;
            border-radius: 1.4rem;
            border: 1px solid #2e3860;
            font-size: 0.9rem;
        }

        .bg-radio-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 0.4rem 0;
            color: #b6c2f0;
        }

        .color-picker-lux {
            background: #0b1022;
            border: 1px solid #3d4a80;
            border-radius: 2rem;
            padding: 0.2rem 0.4rem;
        }

        .resize-physical {
            background: linear-gradient(145deg, #121b36, #0a1025);
            border-radius: 1.6rem;
            padding: 1.2rem;
            margin-top: 1rem;
            border: 1px solid #3f4c82;
        }

        .dimension-input {
            background: #010314;
            border: 1px solid #394472;
            border-radius: 2.5rem;
            padding: 0.5rem 1rem;
            color: white;
            width: 100%;
            font-size: 0.9rem;
        }

        .download-btn {
            background: linear-gradient(135deg, #3f5ae0, #2638a8);
            border: none;
            padding: 0.9rem 1.5rem;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 3rem;
            box-shadow: 0 20px 30px -8px #1f2b70, 0 0 0 1px #93abff inset;
            transition: 0.2s;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 1.5rem;
        }

        .grid-panels {
            display: grid;
            grid-template-columns: 1.2fr 1fr 1fr;
            gap: 1.2rem;
            margin-top: 1.5rem;
        }

        @media (max-width: 900px) {
            .editor-card {
                padding: 1.2rem;
            }

            .grid-panels {
                grid-template-columns: 1fr;
            }
        }

        .icon-highlight {
            color: #7d9aff;
        }
    </style>
</head>

<body>
    <div class="editor-card">
        <!-- header smaller -->
        <div class="kriztech-header">
            <div style="display: flex; align-items: baseline;">
                <span class="logo-glow">EditX</span>
                <span class="logo-small">by Kriztech</span>
            </div>
            <div class="text-gray-400 text-xs flex gap-2">
                <i class="fa-regular fa-star" style="color: #d4af37;"></i>
                <span>AI·Studio</span>
            </div>
        </div>

        <!-- upload row compact -->
        <div class="flex flex-col items-center gap-2 mb-4">
            <div class="upload-area w-full flex justify-between items-center">
                <span class="text-gray-300 text-xs"><i class="fa-regular fa-image mr-1"></i> PNG, JPG</span>
                <label for="upload" class="file-label">
                    <i class="fa-regular fa-folder-open"></i> Browse
                </label>
                <input type="file" id="upload" accept="image/*" class="hidden">
            </div>
        </div>

        <!-- canvas wrapper with controlled max height (SMALLER VIEW) -->
        <div class="canvas-wrapper">
            <canvas id="canvas"></canvas>
        </div>

        <!-- control panels grid (filters, transform+resize, background) -->
        <div class="grid-panels">
            <!-- FILTERS panel compact -->
            <div class="control-panel">
                <div class="panel-title"><i class="fa-solid fa-sliders icon-highlight"></i> Filters</div>
                <div class="slider-label"><span>Brightness</span> <span id="brightnessVal">100%</span></div>
                <input type="range" id="brightness" min="0" max="200" value="100">

                <div class="slider-label"><span>Contrast</span> <span id="contrastVal">100%</span></div>
                <input type="range" id="contrast" min="0" max="200" value="100">

                <div class="slider-label"><span>Saturation</span> <span id="saturationVal">100%</span></div>
                <input type="range" id="saturation" min="0" max="200" value="100">

                <div class="slider-label"><span>Blur</span> <span id="blurVal">0px</span></div>
                <input type="range" id="blur" min="0" max="10" value="0" step="0.1">

                <button id="grayscale" class="luxury-btn mt-3"><i class="fa-regular fa-circle-half-stroke"></i>
                    Grayscale</button>
            </div>

            <!-- TRANSFORM + PHYSICAL RESIZE -->
            <div class="control-panel">
                <div class="panel-title"><i class="fa-solid fa-arrows-spin icon-highlight"></i> Transform</div>
                <button id="rotateLeft" class="luxury-btn"><i class="fa-solid fa-rotate-left"></i> Rotate Left</button>
                <button id="rotateRight" class="luxury-btn"><i class="fa-solid fa-rotate-right"></i> Rotate
                    Right</button>
                <button id="flipH" class="luxury-btn"><i class="fa-solid fa-arrows-left-right"></i> Flip H</button>
                <button id="flipV" class="luxury-btn"><i class="fa-solid fa-arrows-up-down"></i> Flip V</button>
                <button id="crop" class="luxury-btn"><i class="fa-regular fa-square"></i> Center Crop</button>

                <!-- physical resize card (exact dimensions) -->
                <div class="resize-physical">
                    <div style="display: flex; gap: 0.3rem; align-items: center; margin-bottom: 0.8rem;">
                        <i class="fa-solid fa-ruler-combined" style="color:#8aa5ff;"></i>
                        <span style="font-size:0.9rem; font-weight:500;">physical resize</span>
                    </div>
                    <div class="flex gap-2 mb-2">
                        <input type="number" id="resizeWidth" placeholder="w" class="dimension-input" value="800">
                        <span style="color:#778bce;">x</span>
                        <input type="number" id="resizeHeight" placeholder="h" class="dimension-input" value="600">
                    </div>
                    <div class="flex gap-2">
                        <button id="applyResize" class="luxury-btn" style="padding:0.4rem;"><i
                                class="fa-regular fa-check-circle"></i> apply</button>
                        <button id="resetSize" class="luxury-btn" style="padding:0.4rem;"><i
                                class="fa-regular fa-arrow-rotate-left"></i> reset</button>
                    </div>
                </div>
            </div>

            <!-- BACKGROUND + AI -->
            <div class="control-panel">
                <div class="panel-title"><i class="fa-solid fa-fill-drip icon-highlight"></i> Background</div>
                <div class="bg-radio-group">
                    <label><input type="radio" name="bg" value="none" checked> <span>Transparent</span></label>
                    <label><input type="radio" name="bg" value="white"> <span>White</span></label>
                    <label><input type="radio" name="bg" value="color"> <span>Color</span></label>
                    <div class="color-picker-lux flex items-center gap-2 mt-1">
                        <i class="fa-regular fa-eye-dropper" style="font-size:0.8rem;"></i>
                        <input type="color" id="bgColor" value="#ff5e7c"
                            class="w-full h-6 rounded-full border-0 bg-transparent">
                    </div>
                </div>
                <button id="removeBg" class="luxury-btn mt-3"><i class="fa-solid fa-eraser"></i> Remove BG (AI)</button>
            </div>
        </div>

        <!-- download button -->
        <button id="download" class="download-btn">
            <i class="fa-regular fa-circle-down"></i> Download Image
        </button>
    </div>

    <script>
        (function () {
            const canvas = document.getElementById("canvas");
            const ctx = canvas.getContext("2d");
            const upload = document.getElementById("upload");
            const brightness = document.getElementById("brightness");
            const contrast = document.getElementById("contrast");
            const saturation = document.getElementById("saturation");
            const blurEl = document.getElementById("blur");
            const grayscaleBtn = document.getElementById("grayscale");
            const rotateLeft = document.getElementById("rotateLeft");
            const rotateRight = document.getElementById("rotateRight");
            const flipH = document.getElementById("flipH");
            const flipV = document.getElementById("flipV");
            const crop = document.getElementById("crop");
            const download = document.getElementById("download");
            const removeBg = document.getElementById("removeBg");
            const bgRadios = document.querySelectorAll('input[name="bg"]');
            const bgColor = document.getElementById("bgColor");
            const resizeWidth = document.getElementById("resizeWidth");
            const resizeHeight = document.getElementById("resizeHeight");
            const applyResize = document.getElementById("applyResize");
            const resetSize = document.getElementById("resetSize");

            let originalImage = new Image();
            let processedImage = null;
            let rotation = 0;
            let flipHVal = 1;
            let flipVVal = 1;
            let grayscale = false;
            let naturalWidth = 0, naturalHeight = 0;

            function updateSliderLabels() {
                document.getElementById("brightnessVal").innerText = brightness.value + '%';
                document.getElementById("contrastVal").innerText = contrast.value + '%';
                document.getElementById("saturationVal").innerText = saturation.value + '%';
                document.getElementById("blurVal").innerText = blurEl.value + 'px';
            }
            brightness.addEventListener('input', updateSliderLabels);
            contrast.addEventListener('input', updateSliderLabels);
            saturation.addEventListener('input', updateSliderLabels);
            blurEl.addEventListener('input', updateSliderLabels);

            function draw() {
                const img = processedImage || originalImage;
                if (!img || !img.src) return;

                // set canvas dimensions from image (but display will be constrained via CSS)
                canvas.width = img.width;
                canvas.height = img.height;

                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.save();
                ctx.translate(canvas.width / 2, canvas.height / 2);
                ctx.rotate(rotation * Math.PI / 180);
                ctx.scale(flipHVal, flipVVal);
                let filter = `brightness(${brightness.value}%) contrast(${contrast.value}%) saturate(${saturation.value}%) blur(${blurEl.value}px)`;
                if (grayscale) filter += ' grayscale(100%)';
                ctx.filter = filter;
                ctx.drawImage(img, -img.width / 2, -img.height / 2, img.width, img.height);
                ctx.restore();

                // background composite
                const bg = document.querySelector('input[name="bg"]:checked').value;
                const color = bgColor.value;
                if (bg !== "none") {
                    ctx.globalCompositeOperation = "destination-over";
                    ctx.fillStyle = (bg === "white") ? "#ffffff" : color;
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.globalCompositeOperation = "source-over";
                }
            }

            // redraw triggers
            [brightness, contrast, saturation, blurEl].forEach(s => s.addEventListener("input", draw));
            bgRadios.forEach(r => r.addEventListener("change", draw));
            bgColor.addEventListener("input", draw);

            grayscaleBtn.addEventListener("click", () => { grayscale = !grayscale; draw(); });
            rotateLeft.addEventListener("click", () => { rotation -= 90; draw(); });
            rotateRight.addEventListener("click", () => { rotation += 90; draw(); });
            flipH.addEventListener("click", () => { flipHVal *= -1; draw(); });
            flipV.addEventListener("click", () => { flipVVal *= -1; draw(); });

            // crop (center square)
            crop.addEventListener("click", () => {
                if (!canvas.width) return;
                const size = Math.min(canvas.width, canvas.height);
                const imageData = ctx.getImageData((canvas.width - size) / 2, (canvas.height - size) / 2, size, size);
                canvas.width = size;
                canvas.height = size;
                ctx.putImageData(imageData, 0, 0);
                // create new base image from crop
                const temp = new Image();
                temp.src = canvas.toDataURL("image/png");
                temp.onload = () => {
                    originalImage = temp;
                    processedImage = null;
                    rotation = 0; flipHVal = 1; flipVVal = 1; grayscale = false;
                    brightness.value = 100; contrast.value = 100; saturation.value = 100; blurEl.value = 0;
                    updateSliderLabels();
                    naturalWidth = temp.width; naturalHeight = temp.height;
                    resizeWidth.value = temp.width; resizeHeight.value = temp.height;
                    draw();
                };
            });

            // physical resize
            applyResize.addEventListener("click", () => {
                let newW = parseInt(resizeWidth.value) || 400;
                let newH = parseInt(resizeHeight.value) || 300;
                if (newW < 8) newW = 100;
                if (newH < 8) newH = 100;
                const offscreen = document.createElement("canvas");
                offscreen.width = newW;
                offscreen.height = newH;
                const offCtx = offscreen.getContext("2d");
                offCtx.drawImage(canvas, 0, 0, canvas.width, canvas.height, 0, 0, newW, newH);
                canvas.width = newW;
                canvas.height = newH;
                ctx.drawImage(offscreen, 0, 0);
                const newImg = new Image();
                newImg.src = canvas.toDataURL("image/png");
                newImg.onload = () => {
                    originalImage = newImg;
                    processedImage = null;
                    rotation = 0; flipHVal = 1; flipVVal = 1; grayscale = false;
                    brightness.value = 100; contrast.value = 100; saturation.value = 100; blurEl.value = 0;
                    updateSliderLabels();
                    naturalWidth = newW; naturalHeight = newH;
                    draw();
                };
            });

            resetSize.addEventListener("click", () => {
                if (naturalWidth && naturalHeight) {
                    resizeWidth.value = naturalWidth;
                    resizeHeight.value = naturalHeight;
                    const offscreen = document.createElement("canvas");
                    offscreen.width = naturalWidth;
                    offscreen.height = naturalHeight;
                    offscreen.getContext("2d").drawImage(canvas, 0, 0, canvas.width, canvas.height, 0, 0, naturalWidth, naturalHeight);
                    canvas.width = naturalWidth;
                    canvas.height = naturalHeight;
                    ctx.drawImage(offscreen, 0, 0);
                    const newImg = new Image();
                    newImg.src = canvas.toDataURL("image/png");
                    newImg.onload = () => {
                        originalImage = newImg; processedImage = null;
                        rotation = 0; flipHVal = 1; flipVVal = 1; grayscale = false;
                        brightness.value = 100; contrast.value = 100; saturation.value = 100; blurEl.value = 0;
                        updateSliderLabels();
                        draw();
                    };
                }
            });

            upload.addEventListener("change", (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    originalImage.src = ev.target.result;
                    processedImage = null;
                    rotation = 0; flipHVal = 1; flipVVal = 1; grayscale = false;
                    brightness.value = 100; contrast.value = 100; saturation.value = 100; blurEl.value = 0;
                    updateSliderLabels();
                };
                reader.readAsDataURL(file);
            });

            originalImage.onload = function () {
                canvas.width = originalImage.width;
                canvas.height = originalImage.height;
                naturalWidth = originalImage.width;
                naturalHeight = originalImage.height;
                resizeWidth.value = originalImage.width;
                resizeHeight.value = originalImage.height;
                draw();
            };

            download.addEventListener("click", () => {
                const bg = document.querySelector('input[name="bg"]:checked').value;
                const link = document.createElement("a");
                if (bg === "none") {
                    link.download = "editorx.png";
                    link.href = canvas.toDataURL("image/png");
                } else {
                    link.download = "editorx.jpg";
                    link.href = canvas.toDataURL("image/jpeg", 0.96);
                }
                link.click();
            });

            // AI Background removal
            const model = new SelfieSegmentation({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`
            });
            model.setOptions({ modelSelection: 1 });
            model.onResults(res => {
                const tempCanvas = document.createElement("canvas");
                tempCanvas.width = originalImage.width;
                tempCanvas.height = originalImage.height;
                const tctx = tempCanvas.getContext("2d");
                tctx.drawImage(res.segmentationMask, 0, 0, tempCanvas.width, tempCanvas.height);
                tctx.globalCompositeOperation = "source-in";
                tctx.drawImage(originalImage, 0, 0);
                const bg = document.querySelector('input[name="bg"]:checked').value;
                const color = bgColor.value;
                if (bg !== "none") {
                    tctx.globalCompositeOperation = "destination-over";
                    tctx.fillStyle = (bg === "white") ? "#ffffff" : color;
                    tctx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
                }
                tctx.globalCompositeOperation = "source-over";
                processedImage = new Image();
                processedImage.src = tempCanvas.toDataURL("image/png");
                processedImage.onload = () => {
                    canvas.width = processedImage.width;
                    canvas.height = processedImage.height;
                    naturalWidth = processedImage.width; naturalHeight = processedImage.height;
                    resizeWidth.value = processedImage.width; resizeHeight.value = processedImage.height;
                    rotation = 0; flipHVal = 1; flipVVal = 1; grayscale = false;
                    draw();
                };
            });
            removeBg.addEventListener("click", async () => {
                if (!originalImage.src) return alert("Upload image first");
                await new Promise(res => { if (originalImage.complete) res(); else originalImage.onload = res; });
                await model.send({ image: originalImage });
            });

            updateSliderLabels();
        })();
    </script>
</body>

</html>
